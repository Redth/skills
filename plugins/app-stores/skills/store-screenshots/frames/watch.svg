<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 920" width="520" height="920">
  <title>A generic smartwatch: a rounded case and strap, no crown or buttons.</title>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5f68"/>
      <stop offset="0.18" stop-color="#2c2f35"/>
      <stop offset="0.55" stop-color="#1c1e22"/>
      <stop offset="0.85" stop-color="#34373e"/>
      <stop offset="1" stop-color="#4c5059"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1b1f"/>
      <stop offset="0.5" stop-color="#2e3036"/>
      <stop offset="1" stop-color="#1a1b1f"/>
    </linearGradient>
    <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fadeUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="maskTop" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="230"><rect x="0" y="0" width="520" height="230" fill="url(#fadeDown)"/></mask>
    <mask id="maskBottom" maskUnits="userSpaceOnUse" x="0" y="690" width="520" height="230"><rect x="0" y="690" width="520" height="230" fill="url(#fadeUp)"/></mask>
  </defs>
  <rect x="90" y="0" width="340" height="230" rx="40" fill="url(#strap)" mask="url(#maskTop)"/>
  <g class="m">
    <rect x="90" y="690" width="340" height="230" rx="40" fill="url(#strap)" mask="url(#maskBottom)"/>
  </g>
  <rect class="s" x="0" y="150" width="520" height="620" rx="150" fill="url(#band)"/>
  <rect class="s" x="1.25" y="151.25" width="517.5" height="617.5" rx="148.75" fill="none" stroke="url(#sheen)" stroke-width="2.5"/>
  <rect class="s" x="10" y="160" width="500" height="600" rx="140" fill="#08090b"/>
  <rect class="s" x="40" y="190" width="440" height="540" rx="110" fill="#000000"/>
</svg>
